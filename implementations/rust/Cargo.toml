[package]
name = "blog"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "=1.12.1"
deadpool-postgres = "=0.14.2"
hex = "=0.4.3"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "client-legacy", "http1"] }
mysql_async = "=0.37.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "macros"] }
tokio-postgres = "=0.7.18"

